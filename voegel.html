<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vögel – Voegle.ch</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Inter:wght@500&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body>
<header>
    <nav id="sidebar-nav">
        <div class="nav-header">
            <h2 class="nav-titel">Navigation</h2>
        </div>
    <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="voegel.html" class="nav-link active">Vögel</a></li>
        <li><a href="#" class="nav-link" id="nav-wanderliste-link">Wanderliste</a></li>
    </ul>
</nav>
  <button id="warenkorb-toggle">Meine Wanderliste 🐦</button>
<div id="warenkorb-backdrop"></div>
<aside id="warenkorb">

    <!-- Header: wird per JS zwischen leer/gefüllt umgeschaltet -->
    <div id="warenkorb-header">

        <!-- Leerer Zustand: Titel + Zähler -->
        <div id="warenkorb-header-leer">
            <div id="warenkorb-header-title">
                <span id="warenkorb-titel">Meine Wanderliste</span>
                <span id="warenkorb-count">(0)</span>
            </div>
        </div>

        <!-- Befüllter Zustand: Export-Button -->
        <div id="warenkorb-header-gefuellt">
            <button id="warenkorb-exportieren">
                Drucken
            </button>
        </div>

        <!-- Schliessen (immer sichtbar) -->
        <button id="warenkorb-schliessen">✕</button>
    </div>

    <!-- Leerer Zustand -->
    <div id="warenkorb-leer">
        <lottie-player src="assets/lottie-wanderliste.json" background="transparent" speed="1" style="width: 120px; height: 120px;" loop autoplay></lottie-player>
        <p id="warenkorb-leer-titel">Keine Einträge in der Wanderliste</p>
        <p id="warenkorb-leer-text">Wähle Orte und Vögel aus, um sie hier zu sehen</p>
    </div>

    <!-- Befüllter Zustand (wird per JS befüllt) -->
    <div id="warenkorb-liste"></div>

</aside>
</header>
<main>
    <h1>Alle Vögel</h1>
    <div id="content"></div>
</main>
<footer>
</footer>
<script src="js/voegel.js" type="module"></script>
</body>
</html>
